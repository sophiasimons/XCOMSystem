services:
  xcom-ui-rx:
    image: xcom-ui-rx
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "8001:8001"  # Web UI (different port from tx)
      - "8766:8766"  # WebSocket bridge (different port from tx)
      - "5010:5000"  # STM32 RX connection port (host:container). Use an explicit default to avoid interpolation issues
      - "5001:5001"  # FPGA listener port (expose to host for simulation)
    volumes:
      - ./web/app:/usr/src/app/web/app  # Mount web app files for easy development
      - ./received_files:/usr/src/app/web/app/received_files  # Persist received files to host
      - /dev:/dev           # Give access to USB devices
    environment:
      - PYTHONUNBUFFERED=1  # Show Python logs immediately
      - FPGA_IP=${FPGA_IP:-}
      - FPGA_PORT=${FPGA_PORT:-5001}
      - FPGA_BITPACKED=${FPGA_BITPACKED:-0}
      - FPGA_BITORDER=${FPGA_BITORDER:-msb}
      - BRIDGE_ARGS=${BRIDGE_ARGS:-"--ws-port 8766 --web-port 8001 --host 0.0.0.0"}  # Bridge arguments from start script
      - HOST_RECEIVED_DIR=${HOST_RECEIVED_DIR:-}
    # Run the bridge using the BRIDGE_ARGS provided by the start script / environment
    command: sh -c "python ./bridge.py $BRIDGE_ARGS"
    # Make sure container keeps running and restarts if it fails
    restart: unless-stopped