
services:
  xcom-ui:
    image: xcom-ui
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Web UI
      - "8765:8765"  # WebSocket bridge
    volumes:
      - ./web/app:/usr/src/app/web/app  # Mount web app files for easy development
    environment:
      - PYTHONUNBUFFERED=1  # Show Python logs immediately
      - STM32_IP=${STM32_IP}  # STM32 IP address (REQUIRED - set via environment)
      - STM32_PORT=${STM32_PORT:-5000}  # STM32 TCP port (default: 5000)
    # Make sure container keeps running and restarts if it fails
    restart: unless-stopped
