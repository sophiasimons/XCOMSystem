
services:
  xcom-ui:
    image: xcom-ui
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Web UI
      - "8765:8765"  # WebSocket bridge
    volumes:
      - ./web/app:/usr/src/app/web/app  # Mount web app files for easy development
    environment:
      - PYTHONUNBUFFERED=1  # Show Python logs immediately
      - STM32_IP=${STM32_IP:-192.168.1.100}  # STM32 IP address (configurable)
      - STM32_PORT=${STM32_PORT:-5000}       # STM32 TCP port (configurable)
    # Make sure container keeps running and restarts if it fails
    restart: unless-stopped
    network_mode: "host"    # Use host network to access STM32 on local network
